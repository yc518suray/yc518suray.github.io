<link rel="stylesheet" type="text&#x2F;css" href="https://cdn.jsdelivr.net/npm/hexo-tag-hint@0.3.1/dist/hexo-tag-hint.min.css"><!DOCTYPE html>
<html lang="zh-TW">
<head>
	<meta charset="UTF-8">
	<title>404 | R.S. Random Space</title>
	<base href="/">
	<link rel="icon" type="image/png" href="uploads/images/favicon-32x32-next.png">
	<style>
	body {
		margin: 0;
	}
	/* 置中容器 */
	.error-container {
		min-height: 100vh;
		display: flex;
		flex-direction: column;
		justify-content: center;
		align-items: center;
		
		background-image: url('uploads/images/bg.png');
    	background-repeat: no-repeat;
    	background-size: cover;
		
		text-align: center;
		padding: 20px;
	}

	/* 圖片外層容器 */
	.bird-wrapper {
		display: flex;
		gap: 15px;
		align-items: center;
		justify-content: center;
	}

	.bird-item {
		margin-top: auto;
		display: inline-block;
		position: relative;
		transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
		will-change: transform;
	}

	/* 404 圖片本體 */
	.bird-img {
		display: block;
		filter:
			drop-shadow(0 0 6px rgba(0, 229, 255, 0.6))
			drop-shadow(0 0 15px rgba(0, 229, 255, 0.3));

  		/* 平滑過渡動畫 */
		transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), 
							  filter 0.35s ease;
		will-change: filter;
	}

	.bird-item:hover {
		transform: scale(1.15); /* 當滑鼠移入時，該容器整體放大 */
		z-index: 10; /* 確保放大的容器不會被遮擋 */
	}

	.bird-item:hover .bird-img {
		/* 強化螢光效果 */
		filter:
			drop-shadow(0 0 10px rgba(0, 229, 255, 0.9))
			drop-shadow(0 0 25px rgba(0, 229, 255, 0.6));
	}

	/* 補充按鈕與文字排版 */
	.error-title {
		color: #c9ffef;
		margin-top: 2rem;
		font-size: 2.4rem;
	}

	.error-desc {
		color: #c9ffef;
		font-size: 1.2rem;
		margin: 0 0 1.5rem;
	}

	.home-btn {
		padding: 10px 20px;
		border-radius: 8px;
		background: #00e5ff;
		color: #121214;
		text-decoration: none;
		font-weight: bold;
		transition: opacity 0.2s;
	}
	
	.home-btn:hover {
		opacity: 0.85;
	}
	</style>
</head>
<body>
	<div class="error-container">
		<div class="bird-wrapper">
			<div class="bird-item">
				<img src="uploads/images/4-birdgirl.png" width="150px" height="250px" alt="臺灣野鳥女孩-4" class="bird-img" />
			</div>
			<div class="bird-item bird-0">
				<img src="uploads/images/0-birdgirl.png" width="240px" height="300" alt="臺灣野鳥女孩-0" class="bird-img" />
			</div>
			<div class="bird-item">
				<img src="uploads/images/4-birdgirl.png" width="150px" height="250px" alt="臺灣野鳥女孩-4" class="bird-img" />
			</div>
		</div>
		<h1 class="error-title">404 - Page Not Found</h1>
		<p class="error-desc">您要求的頁面找不到喔！臺灣野鳥女孩關心您~</p>
		<a href="/" class="home-btn">返回首頁</a>
	</div>
</body>
</html>
